console_title_template = '{{ .Shell }} in {{ .Folder }}'
final_space = true
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true
[[blocks.segments]]
  type = 'path'
  style = 'plain'
  background = 'transparent'
  foreground = 'blue'
  template = '{{ .Path }}'
[blocks.segments.properties]
  style = 'full'
[[blocks.segments]]
  type = 'git'
  style = 'plain'
  template = ' {{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
[blocks.segments.properties]
  fetch_status = true
  fetch_upstream_icon = true
[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'
[[blocks.segments]]
  type = 'executiontime'
  style = 'plain'
  background = 'transparent'
  foreground = 'yellow'
  template = '{{ div .Ms 1000 }}s'
[blocks.segments.properties]
  threshold = 5000
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true
[[blocks.segments]]
  type = 'text'
  style = 'plain'
  background = 'transparent'
  foreground = 'magenta'
  template = '❯'
[transient_prompt]
  background = 'transparent'
  foreground = 'magenta'
  template = '❯ '
